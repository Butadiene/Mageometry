[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mageometry"
version = "0.1.0.dev0"
description = "Magnetic field line geometry toolkit built on a vectorized geopack (fork of geopack-vectorize, under heavy development)"
authors = [
    {name = "Butadiene"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.7"
keywords = ["space physics", "Tsyganenko model", "magnetosphere", "geomagnetic field", "field line geometry"]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy"
]
dependencies = [
    "numpy>=1.16.0",
    "scipy>=1.0.0"
]

[project.optional-dependencies]
io = [
    "h5py>=3.0"
]
viz = [
    "matplotlib>=3.0"
]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "matplotlib>=3.0",
    "h5py>=3.0"
]
examples = [
    "matplotlib>=3.0",
    "jupyter>=1.0",
    "pandas>=1.0",
    "psutil>=5.0",
    "h5py>=3.0"
]

[project.urls]
Homepage = "https://github.com/Butadiene/Mageometry"
Repository = "https://github.com/Butadiene/Mageometry"
Issues = "https://github.com/Butadiene/Mageometry/issues"

[tool.setuptools.packages.find]
include = ["mageometry*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"mageometry.geopack" = ["igrf_coeffs/*.txt"]
